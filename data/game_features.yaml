GameFeatures:
    - Title: "Открытый мир"
      Image: "assets/images/world_gen.svg"
      Text: >
          Игра начинается в большом уникальном мире.
          На карте появляются ресурсы, лут, враги, события и опасные зоны.
          <br> Исследуй окружение, адаптируйся к ситуации и выживай.

    - Title: "Билдостроение"
      Image: "assets/images/spellbuilds.svg"
      Text: >
          Выбирай происхождение персонажа, от дворянина до преступника.
          Собирай экипировку, находи редкие предметы и усиливай своего персонажа.
          Комбинируй способности, характеристики и снаряжение под нужную роль.
          Стань танком, дамагером, саппортом или собери гибридный билд под свою тактику.

    - Title: "Разнообразные квесты"
      Image: "assets/images/heroes_collection.svg"
      Text: >
          Выполняй задания, находи особые события и выбирай, как реагировать на происходящее.
          В диалогах можно проверять удачу броском и открывать разные варианты ответов.
          Квесты могут вести к наградам, новым испытаниям, редкому луту или неожиданным последствиям.
          <br> Не каждый выбор будет безопасным.

    - Title: "Возможность кооперативной игры"
      Image: "assets/images/coop.svg"
      Text: >
          Играй вместе с друзьями или собирай полноценную гильдию для совместного прохождения.
          Распределяйте роли, делитесь снаряжением и подстраивайте тактику под состав команды.
          В бою важны не только сила персонажа, но и слаженность действий всей группы.

    - Title: "Глубокий геймплей"
      Image: "assets/images/hardcore.svg"
      Text: >
          Игра требует внимательности, планирования и понимания механик.
          Ошибки могут дорого стоить, а каждое решение влияет на дальнейшее прохождение.
          <br> Многие игровые ситуации можно пройти разными путями.