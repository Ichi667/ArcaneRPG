GameMechanics:
    - Title: "Акты"
      Status: InDev
      Text: >
          Карта делится на акты. Каждый акт состоит из нескольких локаций с монстрами и одной безопасной зоны.
          Между локациями можно перемещаться через ворота или порталы, без жестких ограничений внутри текущего акта.
          Для перехода в следующий акт нужно достичь нужного уровня и использовать специальный предмет.

    - Title: "Локации"
      Status: InDev
      Text: >
          Каждая локация состоит из точек интереса, которые могут быть связаны с квестами или существовать отдельно.
          Внутри встречаются PvE и PvP зоны, спавны монстров, интерактивные элементы и скрытые события.
          Примерно половина локаций может содержать отдельную комнату с боссом.

    - Title: "Подземье"
      Status: InDev
      Text: >
          Подземье работает как отдельный псевдо-акт для добычи материалов, нужных для крафта расходников.
          В нем есть стартовая PvE-зона с торговцами и квестерами, отдельные PvE-локации для гринда и PvP-локации с особыми боссами и шахтами.
          Монстры подземья получают фиксированный урон от атак, который зависит от атрибута Истребление и благословений второго акта.

    - Title: "Характеристики игрока"
      Status: Completed
      Text: >
          Персонаж использует набор боевых и защитных характеристик: физический урон, магический урон, скорость атаки, критический шанс, критический урон, вампиризм, урон умений и урон по отдельным типам целей.
          Защита строится вокруг брони, поглощения урона, уклонения, снижения входящего урона и сопротивлений к разным источникам.
          Также есть параметры скорости, восстановления здоровья, восстановления маны, сокращения перезарядки умений и бонусного опыта.

    - Title: "Атрибуты игрока"
      Status: Completed
      Text: >
          Сила повышает здоровье и урон от оружия.
          Ловкость усиливает скорость передвижения, критический урон и урон от снарядов.
          Интеллект увеличивает урон от заклинаний и запас маны.
          Истребление дает фиксированный урон по монстрам из Подземья: 1 единица Истребления равна 1 урону.

    - Title: "Древо пассивных умений"
      Status: Completed
      Text: >
          В игре есть четыре направления пассивного развития: Воин, Ассасин, Следопыт и Волшебник.
          Игрок получает очки древа при повышении уровня и распределяет их между пассивными улучшениями.
          Такая система позволяет усиливать персонажа под выбранную роль и стиль прохождения.

    - Title: "Активные умения"
      Status: Completed
      Text: >
          Активные умения назначаются в специальном меню на отдельные слоты.
          Умения открываются через Свитки умений, которые можно получить с монстров, купить у NPC или заработать за задания.
          Всего доступно 5 слотов с комбинациями: ЛКМ+ЛКМ, ЛКМ+SHIFT, SHIFT+ПКМ, ПКМ+ЛКМ и ПКМ+ПКМ.
          Каждый навык может иметь собственные требования для использования.

    - Title: "Прокачка уровня"
      Status: Completed
      Text: >
          При каждом повышении уровня игрок получает 3 очка атрибутов, 1 очко древа пассивных умений, 1 очко здоровья и 0.5 очка маны.
          Каждый следующий уровень требует больше опыта.
          Прокачка постепенно усиливает персонажа и открывает больше возможностей для настройки билда.

    - Title: "Благословения актов"
      Status: Completed
      Text: >
          У каждого монстра в акте есть небольшой шанс дропнуть свиток благословения.
          Благословение дает постоянный пассивный эффект, но игрок может получить не больше пяти благословений одного акта.
          Благословение первого акта дает физический и магический урон, второго акта усиливает Истребление и скорость передвижения, третьего акта повышает здоровье и вампиризм.

    - Title: "Снаряжение"
      Status: InDev
      Text: >
          Инвентарь снаряжения состоит из 12 слотов: шлем, нагрудник, поножи, ботинки, перчатки, дополнительный слот, 3 кольца, амулет, пояс и артефакт.
          Экипировка усиливает персонажа через характеристики, редкость, зачарования и дополнительные свойства.
          Подбор предметов становится одной из основных частей билдостроения.

    - Title: "Редкость предметов"
      Status: Completed
      Text: >
          Предметы делятся на четыре редкости: обычная, редкая, героическая и мифическая.
          Чем выше редкость предмета, тем сильнее он может быть.
          Обычные предметы можно зачаровать 4 раза, редкие 6 раз, героические 8 раз, мифические 10 раз.

    - Title: "Зачарование предметов"
      Status: Completed
      Text: >
          Предметы можно зачаровывать, чтобы усиливать их характеристики.
          Каждое улучшение может закончиться поломкой предмета, кроме мифических предметов.
          Для зачарования используются обычные и древние свитки: обычные имеют меньший шанс успеха, древние дают более надежное улучшение.

    - Title: "Рунные камни"
      Status: Completed
      Text: >
          Рунные камни вставляются в редкие предметы и усиливают их свойства.
          Руны имеют те же уровни редкости, что и предметы.
          При этом руны можно вставлять в разные предметы независимо от редкости самой вещи.

    - Title: "Мощь игрока"
      Status: Planning
      Text: >
          Мощь игрока показывает общую силу персонажа через основные параметры.
          Формула учитывает защиту, здоровье, урон, ману и уровень персонажа.
          Итоговое значение используется как общий показатель развития героя.

    - Title: "События с рейд-боссом"
      Status: Planning
      Text: >
          В игре могут проходить редкие события с рейд-боссами.
          На таких событиях отключено PvP, а главная цель игроков заключается в убийстве босса.
          После победы одинаковый лут получают 5 игроков из топа по нанесенному урону.

    - Title: "Состояния игрока"
      Status: Completed
      Text: >
          На персонажа могут накладываться негативные состояния.
          Оглушение запрещает движение, активные умения и атаки, а также не развеивается.
          Немота запрещает применять активные умения и может быть развеяна.
          Истощение отключает пассивные умения и может быть развеяно.
          Кровотечение наносит урон каждую секунду по формуле от максимального и недостающего здоровья, также может быть развеяно.

    - Title: "Развеивание"
      Status: Completed
      Text: >
          Развеивание снимает большинство негативных эффектов с персонажа.
          В описании каждого эффекта отдельно указывается, можно ли его развеять.
          Это делает контроль и защитные умения важной частью боевой системы.

    - Title: "Типы урона"
      Status: Completed
      Text: >
          В игре используются три типа урона: магический, физический и чистый.
          Магический и физический урон зависят от соответствующих защитных параметров.
          Чистый урон не блокируется броней, но на него могут влиять остальные модификаторы.

    - Title: "Типы монстров"
      Status: Completed
      Text: >
          Монстры делятся на несколько категорий: монстры Подземья, обычные монстры, элитные монстры и боссы.
          Тип монстра влияет на его роль, сложность, награды и взаимодействие с отдельными характеристиками игрока.
          Монстры Подземья дополнительно связаны с атрибутом Истребление.

    - Title: "Мирные навыки"
      Status: Completed
      Text: >
          В диалогах игрок может пройти проверку мирного навыка.
          Во время проверки выпадает случайное число от 1 до 20, к которому прибавляется значение выбранного навыка.
          Если итог равен нужному порогу или выше него, проверка считается успешной.
          Доступны 6 мирных навыков: Убеждение, Запугивание, Обман, Исполнение, Магия и Выживание.

    - Title: "Происхождение персонажа"
      Status: Completed
      Text: >
          Происхождение открывает уникальные варианты ответов в диалогах и добавляет бонусы к мирным навыкам.
          Игрок может выбрать одно из происхождений: Солдат, Преступник, Дворянин, Мудрец, Скиталец или Шарлатан.
          Каждое происхождение задает отдельный стиль отыгрыша и влияет на проверки в диалогах.
